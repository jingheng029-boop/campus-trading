{% extends "base.html" %}

{% block title %}聊天室 - 校园二手交易平台{% endblock %}

{% block extra_css %}
<style>
    .chat-container {
        height: calc(100vh - 250px);
        min-height: 400px;
        display: flex;
        flex-direction: column;
    }

    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 10px;
        margin-bottom: 15px;
    }

    .message {
        margin-bottom: 12px;
        padding: 8px 12px;
        border-radius: 8px;
        max-width: 80%;
    }

    .message.system {
        background: #e9ecef;
        color: #6c757d;
        text-align: center;
        max-width: 100%;
        font-size: 0.85rem;
    }

    .message.own {
        background: #005293;
        color: white;
        margin-left: auto;
    }

    .message.other {
        background: white;
        border: 1px solid #dee2e6;
    }

    .message-header {
        font-size: 0.75rem;
        margin-bottom: 4px;
        opacity: 0.8;
    }

    .message-time {
        float: right;
        margin-left: 10px;
    }

    .chat-input {
        display: flex;
        gap: 10px;
    }

    .chat-input input {
        flex: 1;
        padding: 12px;
        border: 2px solid #dee2e6;
        border-radius: 25px;
        outline: none;
    }

    .chat-input input:focus {
        border-color: #005293;
    }

    .chat-input button {
        padding: 12px 25px;
        border-radius: 25px;
    }

    .online-count {
        position: absolute;
        top: 15px;
        right: 20px;
        background: #28a745;
        color: white;
        padding: 5px 12px;
        border-radius: 15px;
        font-size: 0.85rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <div class="card position-relative">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-chat-dots"></i> 校园聊天室</h5>
                    <a href="{{ url_for('index') }}" class="btn btn-sm btn-outline-secondary">返回首页</a>
                </div>
                <div class="card-body">
                    <div class="chat-container">
                        <div class="chat-messages" id="messages">
                            <div class="message system">
                                欢迎来到校园聊天室！开始聊天吧~
                            </div>
                        </div>
                        <div class="chat-input">
                            <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
                            <button class="btn btn-primary" onclick="sendMessage()">
                                <i class="bi bi-send"></i> 发送
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- SocketIO -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
    // 连接 SocketIO
    const socket = io();

    // 用户名
    const username = '{{ current_user.username }}';

    // 监听连接
    socket.on('connect', function() {
        console.log('已连接到聊天室');
    });

    // 监听系统消息
    socket.on('system_message', function(data) {
        addMessage('system', '系统', data.msg, '');
    });

    // 监听接收消息
    socket.on('message', function(data) {
        const isOwn = data.username === username;
        addMessage(isOwn ? 'own' : 'other', data.username, data.msg, data.time);
    });

    // 添加消息到页面
    function addMessage(type, username, msg, time) {
        const messagesDiv = document.getElementById('messages');

        let html = '';
        if (type === 'system') {
            html = `<div class="message system">${msg}</div>`;
        } else {
            html = `
                <div class="message ${type}">
                    <div class="message-header">
                        <strong>${username}</strong>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-body">${msg}</div>
                </div>
            `;
        }

        messagesDiv.insertAdjacentHTML('beforeend', html);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // 发送消息
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const msg = input.value.trim();

        if (msg) {
            socket.emit('message', { msg: msg });
            input.value = '';
            input.focus();
        }
    }

    // 回车发送
    document.getElementById('messageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>
{% endblock %}
